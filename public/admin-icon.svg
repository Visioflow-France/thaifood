<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Admin Thaï Food 77">
  <defs>
    <linearGradient id="goldbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7cf99"/>
      <stop offset="0.5" stop-color="#c9a96e"/>
      <stop offset="1" stop-color="#a17f2f"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Tuile dorée arrondie : inversion de l'icône du site vitrine pour
       distinguer l'app admin sur l'écran d'accueil -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="url(#goldbg)" stroke="#0e0e0e" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Monogramme "A" sombre : Administration -->
  <g font-family="'Playfair Display', Georgia, 'Times New Roman', serif" fill="url(#dark)" text-anchor="middle">
    <text x="50" y="70" font-size="60" font-style="italic" font-weight="600">A</text>
  </g>

  <!-- Filet sombre -->
  <rect x="30" y="78" width="40" height="2" rx="1" fill="#0e0e0e" fill-opacity="0.7"/>
</svg>
