name = "thaifood"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

# ---------------------------------------------------------------------------
# BUILD — Workers Builds (intégration git Cloudflare) exécute `wrangler deploy`
# à chaque push. Cette section fait générer le worker AVANT le deploy :
# sans elle, .open-next/ n'existe pas en CI (gitignoré) et wrangler échoue
# avec « entry-point file at .open-next/worker.js was not found ».
# ---------------------------------------------------------------------------
[build]
command = "npm run build:worker"

[assets]
directory = ".open-next/assets"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "thaifood"

# ---------------------------------------------------------------------------
# VARIABLES PUBLIQUES uniquement. Les secrets (FIREBASE_PRIVATE_KEY,
# STRIPE_SECRET_KEY, ADMIN_PASSWORD, SESSION_SECRET…) sont gérés via
# `npx wrangler secret put <NOM>` — JAMAIS dans ce fichier (repo public !).
# ---------------------------------------------------------------------------
[vars]
NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="pk_live_51TdeU3L3fq2EBN5TgAR216reguqkyvzqlQ1IlTEBxHoINGpSrXNYxOnAto8TnUuxw2bc8M4zWOemgKFwBwdwJWtq00s6qRy5HB"
FIREBASE_PROJECT_ID="thaifood77-c0e8b"
PLATFORM_COMMISSION_PERCENT="5"
